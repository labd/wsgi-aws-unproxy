[tox]
envlist = py{311,312,313,314}


[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
commands = coverage run --source wsgi_aws_unproxy --parallel -m pytest {posargs}
extras = test

[testenv:coverage-report]
basepython = python3.13
deps = coverage[toml]
skip_install = true
commands =
    coverage combine
    coverage xml
    coverage report

[testenv:format]
basepython = python3.13
deps = ruff
skip_install = true
commands =
    ruff format --check src tests
    ruff check src tests
