[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wsgi-aws-unproxy"
version = "1.2.1"
description = "Simple wsgi middleware to unproxy AWS"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE", "AUTHORS"]
authors = [{ name = "Lab Digital", email = "opensource@labdigital.nl" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "netaddr>=0.7.19",
  "requests>=2.23.0",
]

[project.urls]
Homepage = "https://github.com/labd/wsgi-aws-unproxy"

[dependency-groups]
dev = [{ include-group = "test" }]
test = [
  "coverage[toml]>=7.17.0",
  "requests-mock>=1.12.1",
  "pytest-cov>=7.1.0",
  "pytest>=9.1.1",
  "ruff>=0.17.2",
]

[tool.uv]
# supply-chain: only resolve releases at least 14 days old; use
# exclude-newer-package for urgent security fixes
exclude-newer = "14 days"

[tool.uv.exclude-newer-package]
# Locked versions newer than the 14-day cutoff; remove after 2026-11-09
certifi = "2026-10-27T00:00:00Z"  # 2026.10.23 fixes GHSA-6q48-6c7w-9gw2
coverage = "2026-10-27T00:00:00Z"  # pyproject requires >=7.17.0
ruff = "2026-10-27T00:00:00Z"  # pyproject requires >=0.17.2

[tool.hatch.build.targets.wheel]
only-include = ["src/wsgi_aws_unproxy.py"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.rst", "CHANGES", "LICENSE", "AUTHORS"]

[tool.pytest.ini_options]
minversion = "3.0"
strict = true
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["wsgi_aws_unproxy"]

[tool.coverage.paths]
source = ["src", ".venv/lib/python*/site-packages"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["wsgi_aws_unproxy", "tests"]
